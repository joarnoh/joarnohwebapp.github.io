<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan QR – Thuisinventaris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:wght@700&family=Carlito:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="scan.css">
</head>
<body data-page="scan">
<div class="app-shell">
  <header class="topbar" id="topbar"></header>

  <main>
    <section>
      <div class="page-heading"><div><h2>Scan QR</h2><div class="muted">Vind een voorwerp via de QR-code.</div></div></div>
      <div class="panel center">
        <h2>QR-code zoeken</h2>
        <p class="muted">Typ de code die op het label staat. Camera-scannen kan later worden gekoppeld.</p>
        <form onsubmit="lookupQr(event)">
          <div class="field"><label for="qr-search">QR-CODE</label><input id="qr-search" placeholder="Bijvoorbeeld QR2" required></div>
          <button class="primary" type="submit">Zoeken</button>
        </form>
        <div id="qr-result"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" id="nav" aria-label="Hoofdnavigatie"></nav>
</div>
<script src="app.js"></script>
<script>
  function lookupQr(event) {
    event.preventDefault();
    const code = document.getElementById("qr-search").value.trim().toLowerCase();
    const item = items.find(i=>i.qr.toLowerCase()===code);
    document.getElementById("qr-result").innerHTML = item
      ? `<div class="notice">Gevonden: <strong>${escapeHtml(item.name)}</strong><br>${escapeHtml(item.location)}</div><button class="secondary" onclick="location.href='index.html?voorwerp=${item.id}'">Bekijk voorwerp</button>`
      : '<div class="notice">Geen voorwerp gevonden met deze QR-code.</div>';
  }
</script>
</body>
</html>
