
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F3EE">
  <title>Inloggen | Thuisinventaris</title>

  <script>
    document.documentElement.dataset.auth = "out";
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Caladea:wght@700&family=Carlito:wght@400;700&display=swap"
  >

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <main class="auth">
    <div class="panel auth-card">

      <div class="brand">
        <div class="brand-mark">T</div>
        <h1>Thuisinventaris</h1>
      </div>

      <h2 id="auth-title">Inloggen</h2>

      <p class="muted" id="auth-text">
        Log in om je spullen te bekijken.
      </p>

      <form id="auth-form">

        <div class="field">
          <label for="email">E-MAILADRES</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="naam@voorbeeld.nl"
            required
          >
        </div>

        <div class="field">
          <label for="password">WACHTWOORD</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
            minlength="8"
          >
        </div>

        <div class="field" id="confirm-field" hidden>
          <label for="confirm">HERHAAL WACHTWOORD</label>
          <input
            id="confirm"
            type="password"
            autocomplete="new-password"
            minlength="8"
          >
        </div>

        <div id="auth-error" class="notice" role="alert" hidden></div>

        <button
          class="primary full"
          type="submit"
          id="auth-submit"
        >
          Inloggen
        </button>

      </form>

      <p class="auth-switch">
        <span id="switch-text">Nog geen account?</span>
        <button class="link" type="button" id="switch">
          Account maken
        </button>
      </p>

      <p class="small muted center">
        Je account wordt in deze browser opgeslagen.
      </p>

    </div>
  </main>

  <script>
    const ACCOUNT_KEY = "thuisinventaris-accounts";
    const USER_KEY = "thuisinventaris-user";

    let registering = false;

    const form = document.getElementById("auth-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirm");

    const confirmField = document.getElementById("confirm-field");
    const errorBox = document.getElementById("auth-error");

    function getAccounts() {
      try {
        const accounts = JSON.parse(
          localStorage.getItem(ACCOUNT_KEY) || "[]"
        );

        return Array.isArray(accounts) ? accounts : [];
      } catch {
        return [];
      }
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = false;
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.hidden = true;
    }

    function switchMode() {
      registering = !registering;

      clearError();
      form.reset();

      document.getElementById("auth-title").textContent =
        registering ? "Account maken" : "Inloggen";

      document.getElementById("auth-text").textContent =
        registering
          ? "Maak een account om je inventaris te beheren."
          : "Log in om je spullen te bekijken.";

      document.getElementById("auth-submit").textContent =
        registering ? "Account aanmaken" : "Inloggen";

      document.getElementById("switch-text").textContent =
        registering ? "Heb je al een account?" : "Nog geen account?";

      document.getElementById("switch").textContent =
        registering ? "Inloggen" : "Account maken";

      confirmField.hidden = !registering;

      passwordInput.autocomplete =
        registering ? "new-password" : "current-password";

      confirmInput.required = registering;
    }

    document.getElementById("switch").addEventListener(
      "click",
      switchMode
    );

    async function hashPassword(password, salt) {
      if (!crypto.subtle) {
        throw new Error(
          "Veilige wachtwoordverwerking is niet beschikbaar. Open de website via HTTPS."
        );
      }

      const encoder = new TextEncoder();

      const key = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        "PBKDF2",
        false,
        ["deriveBits"]
      );

      const bits = await crypto.subtle.deriveBits(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256"
        },
        key,
        256
      );

      return Array.from(new Uint8Array(bits))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    }

    function createSalt() {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      return Array.from(bytes)
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      clearError();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) {
        showError("Vul je e-mailadres en wachtwoord in.");
        return;
      }

      if (password.length < 8) {
        showError("Je wachtwoord moet minimaal 8 tekens bevatten.");
        return;
      }

      const submit = document.getElementById("auth-submit");
      submit.disabled = true;
      submit.textContent = "Even wachten...";

      try {
        const accounts = getAccounts();

        if (registering) {
          if (password !== confirmInput.value) {
            showError("De wachtwoorden komen niet overeen.");
            return;
          }

          if (accounts.some(account => account.email === email)) {
            showError("Er bestaat al een account met dit e-mailadres.");
            return;
          }

          const salt = createSalt();
          const passwordHash = await hashPassword(password, salt);

          accounts.push({
            email,
            salt,
            passwordHash,
            createdAt: new Date().toISOString()
          });

          localStorage.setItem(
            ACCOUNT_KEY,
            JSON.stringify(accounts)
          );

        } else {
          const account = accounts.find(
            account => account.email === email
          );

          if (!account) {
            showError("Dit account bestaat niet.");
            return;
          }

          const hash = await hashPassword(
            password,
            account.salt
          );

          if (hash !== account.passwordHash) {
            showError("Het wachtwoord is niet correct.");
            return;
          }
        }

        localStorage.setItem(USER_KEY, email);

        location.replace("index.html");

      } catch (error) {
        showError(
          error.message || "Er is iets misgegaan. Probeer opnieuw."
        );
      } finally {
        submit.disabled = false;
        submit.textContent = registering
          ? "Account aanmaken"
          : "Inloggen";
      }
    });

    // Al ingelogd? Ga direct naar de inventaris.
    try {
      if (localStorage.getItem(USER_KEY)) {
        location.replace("index.html");
      }
    } catch {
      showError("Lokale opslag is niet beschikbaar.");
    }
  </script>

</body>
</html>
