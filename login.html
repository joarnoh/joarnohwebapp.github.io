<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F3EE">
  <title>Inloggen | Thuisinventaris</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:wght@700&family=Carlito:wght@400;700&display=swap">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>

<body data-page="login">

  <main class="auth">
    <div class="panel auth-card">

      <div class="brand">
        <div class="brand-mark">T</div>
        <h1>Thuisinventaris</h1>
      </div>

      <h2 id="auth-title">Inloggen</h2>
      <p class="muted" id="auth-text">Log in om je spullen te bekijken.</p>

      <form id="auth-form">
        <div class="field">
          <label for="email">E-MAILADRES</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="naam@voorbeeld.nl" required>
        </div>

        <div class="field">
          <label for="password">WACHTWOORD</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
        </div>

        <div class="field" id="confirm-field" hidden>
          <label for="confirm">HERHAAL WACHTWOORD</label>
          <input id="confirm" type="password" autocomplete="new-password">
        </div>

        <div id="auth-error" class="notice" role="alert" hidden></div>

        <button class="primary full" type="submit" id="auth-submit">Inloggen</button>
      </form>

      <p class="auth-switch">
        <span id="switch-text">Nog geen account?</span>
        <button class="link" type="button" id="switch">Account maken</button>
      </p>

      <p class="small muted center">Je account wordt in deze browser opgeslagen.</p>
    </div>
  </main>

  <script>
    const ACCOUNT_KEY = "thuisinventaris-accounts";
    const USER_KEY = "thuisinventaris-user";

    let registering = false;

    const form = document.getElementById("auth-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirm");
    const confirmField = document.getElementById("confirm-field");
    const errorBox = document.getElementById("auth-error");
    const submitButton = document.getElementById("auth-submit");

    function getAccounts() {
      try {
        const accounts = JSON.parse(localStorage.getItem(ACCOUNT_KEY) || "[]");
        return Array.isArray(accounts) ? accounts : [];
      } catch {
        return [];
      }
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = false;
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.hidden = true;
    }

    function switchMode() {
      registering = !registering;
      clearError();
      form.reset();

      document.getElementById("auth-title").textContent = registering ? "Account maken" : "Inloggen";
      document.getElementById("auth-text").textContent = registering
        ? "Maak een account om je inventaris te beheren."
        : "Log in om je spullen te bekijken.";
      submitButton.textContent = registering ? "Account aanmaken" : "Inloggen";
      document.getElementById("switch-text").textContent = registering ? "Heb je al een account?" : "Nog geen account?";
      document.getElementById("switch").textContent = registering ? "Inloggen" : "Account maken";

      confirmField.hidden = !registering;
      confirmInput.required = registering;
      passwordInput.autocomplete = registering ? "new-password" : "current-password";
    }

    document.getElementById("switch").addEventListener("click", switchMode);

    // De salt wordt als hex-tekst opgeslagen, maar crypto.subtle wil bytes.
    function bytesToHex(bytes) {
      return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
    }

    function hexToBytes(hex) {
      const pairs = hex.match(/.{2}/g) || [];
      return new Uint8Array(pairs.map(pair => parseInt(pair, 16)));
    }

    function createSalt() {
      return bytesToHex(crypto.getRandomValues(new Uint8Array(16)));
    }

    async function hashPassword(password, saltHex) {
      if (!window.crypto || !crypto.subtle) {
        throw new Error("Veilige wachtwoordverwerking is niet beschikbaar. Open de website via HTTPS.");
      }

      const key = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]
      );

      const bits = await crypto.subtle.deriveBits(
        { name: "PBKDF2", salt: hexToBytes(saltHex), iterations: 100000, hash: "SHA-256" },
        key,
        256
      );

      return bytesToHex(new Uint8Array(bits));
    }

    function saveUser(email) {
      try {
        localStorage.setItem(USER_KEY, email);
        return localStorage.getItem(USER_KEY) === email;
      } catch {
        return false;
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      clearError();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!/^\S+@\S+\.\S+$/.test(email)) {
        showError("Vul een geldig e-mailadres in.");
        return;
      }

      if (password.length < 8) {
        showError("Je wachtwoord moet minimaal 8 tekens bevatten.");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Even wachten...";

      try {
        const accounts = getAccounts();

        if (registering) {
          if (password !== confirmInput.value) {
            showError("De wachtwoorden komen niet overeen.");
            return;
          }

          if (accounts.some(account => account.email === email)) {
            showError("Er bestaat al een account met dit e-mailadres.");
            return;
          }

          const salt = createSalt();
          const passwordHash = await hashPassword(password, salt);

          accounts.push({ email, salt, passwordHash, createdAt: new Date().toISOString() });

          try {
            localStorage.setItem(ACCOUNT_KEY, JSON.stringify(accounts));
          } catch {
            showError("Deze browser staat het opslaan van een account niet toe.");
            return;
          }
        } else {
          const account = accounts.find(item => item.email === email);

          if (!account || (await hashPassword(password, account.salt)) !== account.passwordHash) {
            showError("Het e-mailadres of wachtwoord klopt niet.");
            return;
          }
        }

        try { if (window.PasswordCredential) await navigator.credentials.store(new PasswordCredential({ id: email, password })); } catch {}

        if (!saveUser(email)) {
          showError("Je browser onthoudt je login niet. Open de site via de GitHub Pages-link en niet als los bestand.");
          return;
        }

        location.replace("index.html");
      } catch (error) {
        showError(error.message || "Er is iets misgegaan. Probeer opnieuw.");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = registering ? "Account aanmaken" : "Inloggen";
      }
    });

    // Al ingelogd? Ga direct naar de inventaris.
    try {
      if (sessionStorage.getItem("thuisinventaris-from-app")) {
        // De app stuurde ons hierheen: toon het formulier en begin met een schone sessie.
        sessionStorage.removeItem("thuisinventaris-from-app");
        localStorage.removeItem(USER_KEY);
      } else if (localStorage.getItem(USER_KEY)) {
        // Noodrem: stuurt de app ons steeds terug, dan stoppen we na 2 keer en tonen we het formulier.
        const tries = (Number(sessionStorage.getItem("thuisinventaris-redirects")) || 0) + 1;
        sessionStorage.setItem("thuisinventaris-redirects", tries);
        if (tries > 2) {
          sessionStorage.removeItem("thuisinventaris-redirects");
          localStorage.removeItem(USER_KEY);
        } else {
          location.replace("index.html");
        }
      }
    } catch {
      showError("Lokale opslag is niet beschikbaar.");
    }
  </script>

</body>
</html>
