<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instellingen – Thuisinventaris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:wght@700&family=Carlito:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="instellingen.css">
</head>
<body data-page="instellingen">
<div class="app-shell">
  <header class="topbar" id="topbar"></header>

  <main>
    <section>
      <div class="page-heading"><div><h2>Instellingen</h2><div class="muted">Beheer je account en je gegevens.</div></div></div>
      <div class="panel">
        <div class="setting"><div><strong>Account</strong><p class="muted small" id="account-email"></p></div><button class="secondary" onclick="logout()">Uitloggen</button></div>
        <div class="setting"><div><strong>Voorbeeldgegevens</strong><p class="muted small">Vul je lijst met voorbeeldspullen en locaties om de app uit te proberen.</p></div><button class="secondary" id="reset">Laden</button></div>
        <div class="setting"><div><strong>Alles wissen</strong><p class="muted small">Verwijder al je voorwerpen en locaties.</p></div><button class="secondary danger" id="wipe">Wissen</button></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" id="nav" aria-label="Hoofdnavigatie"></nav>
</div>
<script src="app.js"></script>
<script>
  document.getElementById("account-email").textContent = localStorage.getItem("thuisinventaris-user") || "";
  document.getElementById("reset").addEventListener("click", () => {
    openModal({ title: "Voorbeeldgegevens laden?", text: "Je eigen voorwerpen en locaties worden vervangen door de voorbeeldgegevens.", confirm: "Laden", onConfirm: () => {
      items = JSON.parse(JSON.stringify(defaultItems)).map(migrate); locations = [...DEFAULT_LOCATIONS];
      persist(); showToast("Voorbeeldgegevens geladen.");
    }});
  });
document.getElementById("wipe").addEventListener("click", () => {
  openModal({ title: "Alles wissen?", text: "Al je voorwerpen en locaties worden verwijderd. Dit kan niet ongedaan worden gemaakt.", confirm: "Wissen", onConfirm: () => {
    items = []; locations = []; persist(); showToast("Alles gewist.");
  }});
});
</script>
</body>
</html>
